name: Backend Spring Boot CI/CD

on:
  push:
    branches:
      - backend
      - main
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Git branch to build'
        default: 'backend'

env:
  DOCKERHUB_USERNAME: nesrinedh
  DEV_TAG: nesrinedh/backends:v1.0.0-dev
  PROD_TAG: nesrinedh/fronts:v1.0.0-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.event.inputs.branch_name || github.ref_name }}

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ env.BRANCH_NAME }}

      # 2. Setup JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # 3. Maven build
      - name: Maven Build
        run: mvn clean install -Dmaven.test.skip=true

      # 4. SonarQube Analysis
      - name: SonarQube Scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_AUTH_TOKEN: ${{ secrets.SONAR_AUTH_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.projectKey=IntegrationAPI \
            -Dsonar.projectName=IntegrationAPI \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_AUTH_TOKEN

      # 5. Build Docker image
      - name: Build Docker Image
        run: |
          if [ "${{ env.BRANCH_NAME }}" == "backend" ]; then
            docker build -t ${{ env.DEV_TAG }} .
          else
            docker build -t ${{ env.PROD_TAG }} .
          fi

      # 6. Docker login & push
      - name: Docker Login & Push
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Docker Image
        run: |
          if [ "${{ env.BRANCH_NAME }}" == "backend" ]; then
            docker push ${{ env.DEV_TAG }}
          else
            docker push ${{ env.PROD_TAG }}
          fi
